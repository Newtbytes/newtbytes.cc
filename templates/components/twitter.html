{% component twitter.metadata(url, img=none, title=none, desc=none, @config) %}
    <meta property="twitter:url" content="{{ url | safe }}">
    <meta property="twitter:domain" content="{{ config.extra.domain | safe }}">

    {% if img %}
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:image" content="{{ img | safe }}">
    {% endif %}

    {% if title %}
        <meta name="twitter:title" content="{{ title | safe }}">
    {% endif %}

    {% if desc %}
        <meta name="twitter:description" content="{{ desc | striptags | safe }}">
    {% endif %}
{% endcomponent twitter.metadata %}
