{% component meta.metadata(canon_url, author, title, desc=none) %}
    <link rel="canonical" href="{{ canon_url | safe }}">
    <meta name="author" content="{{ author }}">
    <title>{{ title | safe }}</title>
    {% if desc %}
        <meta name="description" content="{{ desc | striptags | safe }}">
    {% endif %}
{% endcomponent meta.metadata %}
